name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::gofmt found unformatted files (run 'gofmt -w .')"
            exit 1
          fi

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  nilaway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go install go.uber.org/nilaway/cmd/nilaway@latest
      # All of these check an err return before touching the accompanying
      # value — correct, idiomatic Go (http.Client.Do and the generated
      # Cloud Run gRPC clients both guarantee a non-nil result when err is
      # nil) — but nilaway doesn't model that guarantee and flags it as a
      # false positive. internal/api/api_test.go can't be narrowed further:
      # nilaway reports at the dereference site (every postSync(...).
      # StatusCode/.Body access across the test functions), not at
      # postSync's own http.Client.Do call, so isolating that one helper
      # into its own file doesn't shrink what has to be excluded — verified
      # by trying it.
      - run: nilaway -exclude-errors-in-files internal/notify/slack.go,internal/api/api_test.go,internal/cloudrun/gcp.go,internal/githubapp/githubapp.go ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./... -race -shuffle=on

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: fmt (whole terraform/ tree)
        run: terraform fmt -recursive -check -diff terraform/
      - name: validate controller-sa via its example
        working-directory: terraform/controller-sa/examples/minimal
        run: |
          terraform init -backend=false
          terraform validate

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
