name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      terraform: ${{ steps.filter.outputs.terraform }}
      docker: ${{ steps.filter.outputs.docker }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'examples/**'
            terraform:
              - 'terraform/**'
            docker:
              - 'Dockerfile'
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
            web:
              - 'web/**'

  fmt:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::gofmt found unformatted files (run 'gofmt -w .')"
            exit 1
          fi

  vet:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  vulncheck:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  nilaway:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go install go.uber.org/nilaway/cmd/nilaway@latest
      # All of these check an err return before touching the accompanying
      # value — correct, idiomatic Go (http.Client.Do and the generated
      # Cloud Run gRPC clients both guarantee a non-nil result when err is
      # nil) — but nilaway doesn't model that guarantee and flags it as a
      # false positive. internal/api/api_test.go can't be narrowed further:
      # nilaway reports at the dereference site (every postSync(...).
      # StatusCode/.Body access across the test functions), not at
      # postSync's own http.Client.Do call, so isolating that one helper
      # into its own file doesn't shrink what has to be excluded — verified
      # by trying it. internal/leader/lease.go is the same story: its test
      # fake (hangingDB, simulating a wedged connection) returns
      # (nil, ctx.Err()), and nilaway can't prove ctx.Err() is non-nil after
      # <-ctx.Done() — flagged at lease.go's real (and correctly
      # err-guarded) res.RowsAffected() call, not at the test file.
      # web/node_modules is a stray vendored example .go file from an npm
      # package, nothing to do with this repo. cmd/runcd/client.go is the
      # same http.Client.Do false positive as internal/cloudrun/gcp.go
      # above — the CLI's do() checks err before touching resp.
      - run: nilaway -exclude-errors-in-files internal/notify/slack.go,internal/api/api_test.go,internal/api/sync_batch_test.go,internal/cloudrun/gcp.go,internal/githubapp/githubapp.go,internal/leader/lease.go,cmd/runcd/client.go,web/node_modules ./...

  test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./... -race -shuffle=on

  # Runs the real `runcd validate` binary against every examples/*
  # directory that has a runcd.yaml — a second, independent check on top of
  # internal/config's TestExamplesParse/TestExamplesExpand (it also runs the
  # strict-field decode those tests don't), so a config feature change that
  # silently breaks validate fails CI instead of quietly rotting the docs.
  # No --check-gcp/--check-slack here: those need real GCP credentials/live
  # webhooks this runner doesn't have.
  examples:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build -o /tmp/runcd ./cmd/runcd
      - name: validate every examples/* directory
        run: |
          failed=0
          for dir in examples/*/; do
            [ -f "$dir/runcd.yaml" ] || continue
            echo "--- $dir ---"
            /tmp/runcd validate "$dir" || failed=1
          done
          exit $failed

  terraform:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: fmt (whole terraform/ tree)
        run: terraform fmt -recursive -check -diff terraform/
      - name: validate controller-sa via its example
        working-directory: terraform/controller-sa/examples/minimal
        run: |
          terraform init -backend=false
          terraform validate
      - name: validate image-events via its example
        working-directory: terraform/image-events/examples/minimal
        run: |
          terraform init -backend=false
          terraform validate

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
